<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuMei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#FFF6E9; --card:#FFFDF9; --ink:#2B1A12; --muted:#6E4C3E; --accent:#9C3B24; --line:#F0DCC8; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; line-height:1.6; }
.wrap { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
header { text-align:center; margin-bottom:24px; }
header .app { color:var(--accent); font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:13px; }
h1 { font-size:34px; line-height:1.15; margin:6px 0 4px; }
.updated { color:var(--muted); font-size:14px; }
main { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px 22px; }
h2 { font-size:22px; margin:28px 0 8px; color:var(--accent); }
h2:first-child { margin-top:0; }
h3 { font-size:17px; margin:20px 0 6px; }
p, li { font-size:16px; }
ul { padding-left:22px; }
li { margin:4px 0; }
a { color:var(--accent); word-break:break-word; }
code { background:#F6E9DA; padding:1px 5px; border-radius:6px; font-size:14px; }
.table { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:15px; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); }
nav { text-align:center; margin-top:22px; font-size:15px; }
nav a { margin:0 10px; }
.links { display:grid; gap:12px; }
.links a { display:block; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; text-decoration:none; color:var(--ink); font-weight:800; font-size:18px; }
.links a span { display:block; color:var(--muted); font-weight:600; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
<header><div class="app">LuMei</div><h1>LuMei</h1></header>
<main class="links">
<a href="privacy.html">Privacy Policy<span>What the app keeps, and what it never shares.</span></a>
<a href="terms.html">Terms of Use<span>The rules for using LuMei.</span></a>
</main>
<nav><a href="./">Home</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a></nav>
</div>
</body>
</html>
